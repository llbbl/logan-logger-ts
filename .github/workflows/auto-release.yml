name: Auto Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Confirm the exact next major version (for example, 3.0.0)'
        required: true
        type: string
  push:
    branches:
      - main
      # Maintenance lines: 1.x, 2.x, ... Releases cut from these publish under
      # a channel dist-tag and never claim `latest` on npm.
      - '*.x'
    paths-ignore:
      # Neither path can reach a consumer: package.json#files ships dist,
      # README.md and LICENSE, and deno.json#publish.include ships src,
      # README.md and LICENSE. A change confined to workflows or to docs/
      # therefore has nothing to publish, so it should not cut a version.
      #
      # This skips a run only when *every* changed file matches, so a PR
      # touching source alongside docs still releases normally. README.md is
      # deliberately absent from this list: it is in the published tarball, so
      # a README-only change does need a release to update the npm page.
      - '.github/**'
      - 'docs/**'

# Serialize versioning and publication together so a slower older run cannot
# reclaim npm's latest tag after a newer release on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Required for npm OIDC and JSR publishing

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      tag: ${{ steps.version.outputs.next }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      is_default: ${{ steps.version.outputs.is_default }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` input — pnpm/action-setup reads `packageManager` from
      # package.json, so CI and this workflow can never drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Determine next version
        id: version
        run: node ./scripts/release-policy.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update versions
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          # Update package.json
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          # Update deno.json
          jq --arg v "$NEW_VERSION" '.version = $v' deno.json > deno.json.tmp
          mv deno.json.tmp deno.json
          echo "Updated versions:"
          echo "  package.json: $(jq -r '.version' package.json)"
          echo "  deno.json: $(jq -r '.version' deno.json)"

      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test --run

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.next }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_RELEASE_TAG: ${{ steps.version.outputs.next }}
        run: |
          # Re-fetch/recheck after verification: queued or re-run workflows must
          # never release an obsolete commit or reuse a newly-created version.
          git fetch origin --tags
          node ./scripts/release-policy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json deno.json
          git commit -m "chore(release): bump version to v$VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          # A concurrent branch update or tag collision rejects BOTH updates.
          # Push only this tag; unrelated local tags must never escape.
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG:refs/tags/$TAG"


  publish:
    name: Publish Package
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC and JSR publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # No `version:` input — pnpm/action-setup reads `packageManager` from
      # package.json, so CI and this workflow can never drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pushed release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: node ./scripts/release-policy.mjs --verify-tag "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Install latest npm
        run: npm install -g npm@latest

      # Publish to npm with OIDC provenance.
      # --tag is explicit: without it every publish claims `latest`, so a 1.x
      # hotfix released after 2.0.0 would silently make the old major the
      # default install for everyone.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$NPM_CHANNEL"
        env:
          NPM_CHANNEL: ${{ needs.version.outputs.channel }}

      # Publish to JSR.
      # JSR has no dist-tag equivalent and needs none. It computes "latest" as
      # max(semver) over non-prerelease, non-yanked versions -- publication
      # timestamp has zero influence -- so a 1.x patch released after 2.0.0
      # leaves latest at 2.0.0. Range specifiers (jsr:@logan/logger@^1.1.0)
      # resolve to the highest version satisfying the range, so 1.x consumers
      # pick up maintenance patches with no channel mechanism at all.
      #
      # Confirmed three ways: jsr-io/jsr's own query in
      # api/src/db/sql_fragments.rs ("version NOT LIKE '%-%' AND is_yanked =
      # false ORDER BY version DESC LIMIT 1"); jsr-io/jsr#1112, which records
      # the rationale for not adopting dist-tags; and empirically against
      # @hono/hono, which reports 4.13.3 as latest while holding twelve 4.9.x
      # versions -- proving the ordering is semver-aware, not lexicographic.
      - name: Publish to JSR
        run: pnpx jsr publish

  release:
    name: Create Release
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pushed release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: node ./scripts/release-policy.mjs --verify-tag "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          # A maintenance release must not displace the current major as the
          # repository's "Latest" release.
          make_latest: ${{ needs.version.outputs.is_default }}
