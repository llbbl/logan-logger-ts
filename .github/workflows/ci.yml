name: CI

on:
  push:
    branches: [ main, dev, '*.x' ]
  pull_request:
    branches: [ main, dev, '*.x' ]

jobs:
  test-node:
    name: Test on Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19', '22.12', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `version:` input — pnpm/action-setup reads `packageManager` from
      # package.json, so CI and the release workflow can never drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Dependencies are always installed under Node 22.x, whatever version is
      # under test: pnpm 11.9.0 refuses to run below Node 22.13, which is
      # stricter than this package's own floor of 22.12. Pinning to '22' rather
      # than an exact patch keeps a future pnpm bump from breaking this again.
      #
      # This is a toolchain constraint only. The published library still
      # supports Node 20 (see engines.node), which is why 20.19 stays in the
      # matrix. Safe because the package has no native dependencies, so the
      # installed tree is portable across Node versions.
      - name: Setup Node.js 22 (toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Switch to the Node version actually under test. Tools are invoked from
      # node_modules/.bin rather than via `pnpm run`, because pnpm itself
      # cannot execute on Node 20.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Confirm Node version under test
        run: node -v

      - name: Run linter
        run: ./node_modules/.bin/biome lint src

      - name: Run type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        env:
          NODE_UNDER_TEST: ${{ matrix.node-version }}
        run: |
          if [ "$NODE_UNDER_TEST" = "20.19" ]; then
            # Known vitest worker-thread flakiness on Node 20.19; retry once
            # before failing, rather than ignoring the result outright.
            ./node_modules/.bin/vitest run --reporter=default \
              || ./node_modules/.bin/vitest run --reporter=default
          else
            ./node_modules/.bin/vitest run --reporter=default
          fi

      - name: Build library
        run: |
          rm -rf dist
          ./node_modules/.bin/vite build

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test tests/bun.test.ts

      - name: Test TypeScript compilation
        run: bun run typecheck

  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Deno dependencies (frozen lockfile)
        run: deno install --frozen=true

      # JSR publishes src/ rather than a build output, so this is the source
      # Deno consumers type-check against. The test step below runs with
      # --no-check, which is why two TS4114 errors shipped unnoticed.
      - name: Type check every entry point
        run: deno task check

      - name: Run Deno tests
        run: deno test --no-check --allow-read --allow-env tests/deno-simple.test.ts

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # >= 22.13 required by pnpm 11.9.0; see note in test-node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Test built artifacts
        run: |
          node -e "const lib = require('./dist/index.cjs'); console.log('CJS build works:', typeof lib.createLogger === 'function')"
          node -e "import('./dist/index.mjs').then(lib => console.log('ESM build works:', typeof lib.createLogger === 'function'))"

      - name: Validate package metadata and types
        run: pnpm lint:package

      - name: Test packed package consumers
        run: pnpm test:package

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # >= 22.13 required by pnpm 11.9.0; see note in test-node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: anything reaching consumers of the published package.
      - name: Audit production dependencies
        run: pnpm audit --prod

      # Blocking: ECDSA registry signatures (pnpm 11).
      - name: Verify registry signatures
        run: pnpm audit signatures

      # Informational: dev-tooling advisories (vite/vitest/postcss chain) do
      # not ship to consumers, so they are reported but do not fail the build.
      - name: Audit all dependencies (informational)
        run: pnpm audit
        continue-on-error: true

      - name: Run dependency scan
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
