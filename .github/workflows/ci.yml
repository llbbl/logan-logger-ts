name: CI

on:
  push:
    branches: [ main, dev, '*.x' ]
  pull_request:
    branches: [ main, dev, '*.x' ]

jobs:
  test-node:
    name: Test on Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12', '24', '26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `version:` input — pnpm/action-setup reads `packageManager` from
      # package.json, so CI and the release workflow can never drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Dependencies are always installed under Node 22.x, whatever version is
      # under test: pnpm 11.9.0 refuses to run below Node 22.13, which is
      # stricter than this package's own floor of 22.12. Pinning to '22' rather
      # than an exact patch keeps a future pnpm bump from breaking this again.
      #
      # This is a toolchain constraint only, and it is why the 22.12 matrix job
      # cannot run pnpm directly: it installs here under a newer Node, then
      # switches down to the version under test. Safe because the package has
      # no native dependencies, so the installed tree is portable across Node
      # versions.
      #
      # Do not "simplify" this away by raising the floor to 22.13. The floor is
      # deliberately 22.12 because that is where `require(esm)` shipped
      # unflagged — the capability boundary that actually matters for a dual
      # ESM/CJS package. Moving it to 22.13 would let a pnpm constraint dictate
      # the package's public contract, and would silently drop the only job
      # that proves the advertised floor works.
      - name: Setup Node.js 22 (toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Switch to the Node version actually under test. Tools are invoked from
      # node_modules/.bin rather than via `pnpm run`, because pnpm itself
      # cannot execute on 22.12 (see above).
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Confirm Node version under test
        run: node -v

      - name: Run linter
        run: ./node_modules/.bin/biome lint src

      - name: Run type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        run: ./node_modules/.bin/vitest run --reporter=default

      - name: Build library
        run: |
          rm -rf dist
          ./node_modules/.bin/vite build

  conformance:
    name: Treering Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to a tag, never a branch: the fixtures are the contract this
      # build is judged against, so which revision ran must be reproducible
      # from the workflow file alone. Bump this deliberately when adopting a
      # new fixture release.
      - name: Checkout treering fixtures
        uses: actions/checkout@v4
        with:
          repository: llbbl/treering
          ref: fixtures-v0.1.3
          path: .treering
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # >= 22.13 required by pnpm 11.9.0; see note in test-node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner skips its whole suite when it cannot find fixtures, so that
      # a contributor without treering checked out can still run `pnpm test`.
      # That is the right default locally and the wrong one here: without this
      # guard a broken checkout would turn every conformance case into a
      # silent pass. Fail before the suite gets the chance.
      - name: Confirm fixtures were checked out
        run: test -f .treering/fixtures/README.md

      # The pin above is what makes this build reproducible. It is also what
      # lets the fixture set move without anyone noticing: three PRs in a row
      # went green against a tag that predated the fixtures they were meant to
      # exercise, each caught by hand. Compare against treering's default
      # branch and fail, so drift is a red build instead of a silent gap.
      #
      # Scoped to fixtures/ on purpose. SPEC prose changes constantly and must
      # not force a tag bump; a fixture change means this build no longer knows
      # whether it conforms, which is a different thing entirely.
      - name: Fail if the pinned fixtures are behind treering
        working-directory: .treering
        env:
          TREERING_DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$TREERING_DEFAULT_BRANCH"

          if git diff --quiet HEAD FETCH_HEAD -- fixtures/; then
            echo "Pinned fixtures match treering/$TREERING_DEFAULT_BRANCH."
            exit 0
          fi

          newest=$(git ls-remote --tags --refs origin 'fixtures-*' \
            | awk -F/ '{print $NF}' | sort -V | tail -n1)

          echo "::error::fixtures/ has changed on treering/$TREERING_DEFAULT_BRANCH since the pinned tag. This build does not know whether it still conforms. Cut a fixtures tag if needed, then bump 'ref:' in the conformance job. Newest tag on the remote: ${newest:-none}."
          git diff --stat HEAD FETCH_HEAD -- fixtures/
          exit 1

      # Non-zero exit on any failing case, which fails the build.
      - name: Run conformance suite
        env:
          TREERING_FIXTURES: ${{ github.workspace }}/.treering/fixtures
        run: ./node_modules/.bin/vitest run tests/conformance --reporter=verbose

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test tests/bun.test.ts

      - name: Test TypeScript compilation
        run: bun run typecheck

  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Deno dependencies (frozen lockfile)
        run: deno install --frozen=true

      # JSR publishes src/ rather than a build output, so this is the source
      # Deno consumers type-check against. The test step below runs with
      # --no-check, which is why two TS4114 errors shipped unnoticed.
      - name: Type check every entry point
        run: deno task check

      - name: Run Deno tests
        run: deno test --no-check --allow-read --allow-env tests/deno-simple.test.ts

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # >= 22.13 required by pnpm 11.9.0; see note in test-node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Test built artifacts
        run: |
          node -e "const lib = require('./dist/index.cjs'); console.log('CJS build works:', typeof lib.createLogger === 'function')"
          node -e "import('./dist/index.mjs').then(lib => console.log('ESM build works:', typeof lib.createLogger === 'function'))"

      - name: Validate package metadata and types
        run: pnpm lint:package

      - name: Test packed package consumers
        run: pnpm test:package

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # >= 22.13 required by pnpm 11.9.0; see note in test-node.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: anything reaching consumers of the published package.
      - name: Audit production dependencies
        run: pnpm audit --prod

      # Blocking: ECDSA registry signatures (pnpm 11).
      - name: Verify registry signatures
        run: pnpm audit signatures

      # Informational: dev-tooling advisories (vite/vitest/postcss chain) do
      # not ship to consumers, so they are reported but do not fail the build.
      - name: Audit all dependencies (informational)
        run: pnpm audit
        continue-on-error: true

      - name: Run dependency scan
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
